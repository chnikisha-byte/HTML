<!DOCTYPE html>
<html>

<head>
    <title>Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            overflow: hidden;
            background-color: aquamarine;
        }

        .topnav a {
            float: left;
            color: azure;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: antiquewhite;
            color: black;
        }

        .topnav a.active {
            background-color: aliceblue;
            color: black;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a href="#home">Home</a>
    </div>
    <h1>Welcome to My Website</h1>
    <p>This is my website.</p>
</body>

</html>
