<html>
    <head>
        <title>CSS Box Model Example</title>
        <style type="text/css">
            .example1{
                width: 220px;
                background-color: aqua;
                padding: 0px;
                border: 0px;
                margin: 0px;
            }
            .example2{
            width: 220px;
            background-color: aquamarine;
            padding: 50px;
            border: 5px solid black;
            margin: 40px 20px;
            }
            hr{
                background-color: cornflowerblue;
            }
        </style>
    </head>
    <body>
        <h1>Box Model Example</h1>
        <hr>
        <p class="example1">My Conect Example 1</p>
        <hr style="width: 100%; height: 10px; color: cadetblue;">
        <p class="example2">My Conect Example 2</p>
        <hr style="width: 100%; height: 1px; color: cadetblue;">
    </body>
</html>
