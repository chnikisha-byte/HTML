<html>
<head>
    <style>
        div.relative {
            position: relative;
            left: 30px;
            border: 3px solid rgb(155, 127, 255);
        }

        div.fixed {
            position: fixed;
            left: 30px;
            border: 3px solid rgb(155, 127, 255);
        }

        div.absolute {
            position: absolute;
            left: 30px;
            border: 3px solid rgb(155, 127, 255);
        }

        div.static {
            position: static;
            left: 30px;
            border: 3px solid rgb(155, 127, 255);
        }

        div.sticky {
            position: sticky;
            top: 1px;
            left: 20px;
            width: 100px;
            border: 3px solid rgb(155, 127, 255);
        }
    </style>
</head>
<body>
    <h2>Positions</h2>
    <p>An element with position: relative; is positioned relative to its normal position:</p>
    <div class="relative">
        This div element has position: relative;
    </div><br><br>
    <div class="fixed">
        This div element has position: fixed;
    </div><br><br>
    <div class="absolute">
        This div element has position: absolute;
    </div><br><br>
    <div class="static">
        This div element has position: static;
    </div>
    <div class="sticky">
        Div with sticky position property
    </div>

</body>
